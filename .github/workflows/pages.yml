name: Deploy site to GitHub Pages

on:
  push:
    # Only the branch the github-pages environment allows to deploy. Adding a
    # dev branch here starts a run that the environment rejects in ~2s, and
    # because of the shared `pages` concurrency group with cancel-in-progress
    # that rejected run cancels the real deploy.
    branches:
      - claude/rap-beat-generator-app-d143vh
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
